<!doctype html>
<canvas width="320" height="160"></canvas>

<script>
const gl = document.querySelector("canvas").getContext("webgl2");

const vertex = `#version 300 es
precision highp float;
precision highp int;

layout(location = 0) in highp uint paint_and_rect_flag;
flat out highp uint is_rect;

void main() {
  uint vertex = uint(gl_VertexID);
  float corner_x = float(vertex & 1u);
  float corner_y = float(vertex >> 1u);
  float left = -0.9 + float(gl_InstanceID);

  gl_Position = vec4(
    left + 0.8 * corner_x,
    -0.8 + 1.6 * corner_y,
    0.0,
    1.0
  );

  bool value = (paint_and_rect_flag & 0x80000000u) != 0u;
  is_rect = value ? 1u : 0u;
}
`;

const fragment = `#version 300 es
precision highp float;
precision highp int;

flat in highp uint is_rect;
out vec4 color;

void main() {
  color = is_rect != 0u
    ? vec4(0.0, 1.0, 0.0, 1.0)
    : vec4(1.0, 0.0, 0.0, 1.0);
}
`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Uint32Array([0x80000000, 0]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribIPointer(0, 1, gl.UNSIGNED_INT, 4, 0);
gl.vertexAttribDivisor(0, 1);

gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 2);
</script>
