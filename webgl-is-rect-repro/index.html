<!doctype html>
<canvas></canvas>
<script>
const gl = document.querySelector("canvas").getContext("webgl2");

const vertexSource = `#version 300 es
precision highp int;

layout(location = 0) in uint paint_and_rect_flag;
flat out uint is_rect;

void main() {
  vec2 positions[3] = vec2[3](
    vec2(-1.0, -1.0),
    vec2( 3.0, -1.0),
    vec2(-1.0,  3.0)
  );
  is_rect = (paint_and_rect_flag & 0x80000000u) != 0u ? 1u : 0u;
  vec2 position = positions[gl_VertexID];
  position.x = position.x * 0.25 + float(gl_InstanceID) - 0.75;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

const fragmentSource = `#version 300 es
precision highp float;
precision highp int;

flat in uint is_rect;
out vec4 color;

void main() {
  color = is_rect != 0u
    ? vec4(0.0, 1.0, 0.0, 1.0)
    : vec4(1.0, 0.0, 0.0, 1.0);
}
`;

function shader(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
gl.linkProgram(program);
gl.useProgram(program);
gl.bindVertexArray(gl.createVertexArray());

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Uint32Array([0x80000000]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribIPointer(0, 1, gl.UNSIGNED_INT, 0, 0);
gl.vertexAttribDivisor(0, 1);
gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 1);
</script>
