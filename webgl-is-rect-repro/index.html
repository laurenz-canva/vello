<!doctype html>
<html>
<head>
  <style>
    html, body, canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      display: block;
      overflow: hidden;
    }

    .info {
      position: fixed;
      top: 12px;
      left: 12px;
      max-width: calc(100% - 44px);
      padding: 8px 10px;
      background: rgb(0 0 0 / 70%);
      color: white;
      font: 14px/1.4 sans-serif;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas></canvas>
  <div class="info"></div>
  <script>
    const canvas = document.querySelector("canvas");
    const gl = canvas.getContext("webgl2");
    const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
    const unavailable = "Unavailable";
    const gpuInfo = [
      `WEBGL_debug_renderer_info: ${debugInfo ? "available" : "unavailable"}`,
      `Masked vendor: ${gl.getParameter(gl.VENDOR)}`,
      `Masked renderer: ${gl.getParameter(gl.RENDERER)}`,
      `Unmasked vendor: ${
        debugInfo
          ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL)
          : unavailable
      }`,
      `Unmasked renderer: ${
        debugInfo
          ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
          : unavailable
      }`,
      `WebGL version: ${gl.getParameter(gl.VERSION)}`,
      `GLSL version: ${gl.getParameter(gl.SHADING_LANGUAGE_VERSION)}`
    ];

    document.querySelector(".info").textContent = gpuInfo.join("\n");

    const vertexSource = `#version 300 es

precision highp int;

layout(location = 0) in uint paint_and_rect_flag;
flat out uint paint_and_rect_flag_out;

void main() {
    vec2 positions[3] = vec2[3](
        vec2(-1.0, -1.0),
        vec2( 3.0, -1.0),
        vec2(-1.0,  3.0)
    );
    paint_and_rect_flag_out = paint_and_rect_flag;
    gl_Position = vec4(positions[gl_VertexID], 0.0, 1.0);
}
`;

    const fragmentSource = `#version 300 es

precision highp float;
precision highp int;

flat in uint paint_and_rect_flag_out;
layout(location = 0) out vec4 out_color;

void main() {
    bool is_rect = (paint_and_rect_flag_out & 0x80000000u) != 0u;
    out_color = is_rect
        ? vec4(0.0, 1.0, 0.0, 1.0)
        : vec4(1.0, 0.0, 0.0, 1.0);
}
`;

    function shader(type, source) {
      const result = gl.createShader(type);
      gl.shaderSource(result, source);
      gl.compileShader(result);
      return result;
    }

    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    gl.useProgram(program);
    gl.bindVertexArray(gl.createVertexArray());

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(
      gl.ARRAY_BUFFER,
      new Uint32Array([0x80000000]),
      gl.STATIC_DRAW
    );
    gl.enableVertexAttribArray(0);
    gl.vertexAttribIPointer(0, 1, gl.UNSIGNED_INT, 0, 0);
    gl.vertexAttribDivisor(0, 1);

    function draw() {
      const scale = devicePixelRatio;
      canvas.width = innerWidth * scale;
      canvas.height = innerHeight * scale;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 1);
    }

    addEventListener("resize", draw);
    draw();
  </script>
</body>
</html>
