env:
  # We aim to always test with the latest stable Rust toolchain, however we pin to a specific
  # version like 1.70. Note that we only specify MAJOR.MINOR and not PATCH so that bugfixes still
  # come automatically. If the version specified here is no longer the latest stable version,
  # then please feel free to submit a PR that adjusts it along with the potential clippy fixes.
  RUST_STABLE_VER: "1.95" # In quotes because otherwise (e.g.) 1.70 would be interpreted as 1.7
  # The purpose of checking with the minimum supported Rust toolchain is to detect its staleness.
  # If the compilation fails, then the version specified here needs to be bumped up to reality.
  # Be sure to also update the rust-version property in the workspace Cargo.toml file,
  # plus all the README.md files of the affected packages.
  # Remove the MSRV jobs' single-use-lifetimes allowance once this is at least 1.97.
  RUST_MIN_VER: "1.89"
  # List of packages that will be checked with the minimum supported Rust version.
  # This should be limited to packages that are intended for publishing.
  RUST_MIN_VER_PKGS: "-p vello -p vello_encoding -p vello_shaders -p vello_common -p vello_cpu -p vello_gpu -p glifo"
  # List of packages that will be checked for `no_std` builds.
  # This should be limited to packages that are intended for publishing.
  RUST_NO_STD_PKGS: "-p vello_common -p vello_cpu -p glifo"
  # List of features that depend on the standard library and will be excluded from no_std checks.
  FEATURES_DEPENDING_ON_STD: "std,default,png,pico_svg,multithreading,probe"
  # List of packages that can not target Wasm.
  # `vello_research_tests` uses `nv-flip`, which doesn't support Wasm.
  NO_WASM_PKGS: "--exclude vello_research_tests --exclude xtask"
  # The files stored in LFS the tests need to access, in JSON format
  LFS_FILES: '["research/vello_research_tests/snapshots/*.png", "vello_tests/snapshots/*.png"]'


# Rationale
#
# The exhaustive merge/main clippy pass doesn't use --all-targets because then even --lib and
# --bins are compiled with dev dependencies enabled, which does not match how users compile them.
# A dev dependency might enable a feature that we need for a regular dependency,
# and checking with --all-targets would not find our feature requirements lacking.
# This problem still applies to cargo resolver version 2.
# Thus the exhaustive pass splits the targets into two steps, one with --lib --bins and another
# with --tests --benches --examples. Pull requests use one --all-targets pass as a fast sentinel.
# Also, we can't give --lib --bins explicitly because then cargo will error on binary-only packages.
# Luckily the default behavior of cargo with no explicit targets is the same but without the error.
#
# We use cargo-hack for a similar reason. Cargo's --workspace will do feature unification across
# the whole workspace. While cargo-hack will instead check each workspace package separately.
#
# Using cargo-hack also allows us to more easily test the feature matrix of our packages.
# We use --each-feature & --optional-deps which will run a separate check for every feature.
#
# We use cargo-nextest for the regular workspace test binaries. The large generated vello_tests
# binary deliberately uses libtest instead: nextest's process-per-test isolation prevents its GPU
# fixture from being reused and is particularly expensive on Windows and macOS.
# Cargo-nextest does not support running doc tests, so we also have a cargo test --doc step.
# For more information see https://github.com/nextest-rs/nextest/issues/16
#
# The MSRV jobs run only cargo check because different clippy versions can disagree on goals and
# running tests introduces dev dependencies which may require a higher MSRV than the bare package.
#
# For no_std checks we target x86_64-unknown-none, because this target doesn't support std
# and as such will error out if our dependency tree accidentally tries to use std.
# https://doc.rust-lang.org/stable/rustc/platform-support/x86_64-unknown-none.html
#
# Pull request and merge-group caches are scoped to synthetic refs and cannot seed other pull
# requests. Only main writes Rust caches; all other events restore the compatible main cache.

name: CI

on:
  pull_request:
  merge_group:
  # We run on push, even though the commit is the same as when we ran in merge_group.
  # This allows the cache to be primed.
  # See https://github.com/orgs/community/discussions/66430
  push:
    branches:
      - main

# Cancel superseded CI runs for the same PR to save runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Install Taplo
        uses: uncenter/setup-taplo@09968a8ae38d66ddd3d23802c44bf6122d7aa991 # v1
        with:
          version: "0.9.3"

      - name: Run taplo fmt
        run: taplo fmt --check --diff

      - name: check copyright headers
        run: bash .github/copyright.sh
      
      - name: Install cargo-rdme
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-rdme@1.4.8

      - name: Run cargo rdme (vello_cpu)
        run: cargo rdme --check --workspace-project=vello_cpu

      - name: Run cargo rdme (vello_common)
        run: cargo rdme --check --workspace-project=vello_common
    
      - name: Run cargo rdme (vello_gpu)
        run: cargo rdme --check --workspace-project=vello_gpu

      - name: Run cargo rdme (glifo)
        run: cargo rdme --check --workspace-project=glifo

      - name: check typos
        uses: crate-ci/typos@v1.45.0

  clippy-stable:
    name: cargo clippy and feature checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: x86_64-unknown-none,wasm32-unknown-unknown
          components: clippy

      - name: install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: install native dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libfontconfig-dev

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Pull requests get one broad, fast lint pass. The feature powerset below remains on the
      # merge queue and main, where its cost does not delay the first round of review feedback.
      - name: cargo clippy (pull request)
        if: github.event_name == 'pull_request'
        run: cargo clippy --workspace --exclude vello_bench --locked --all-features --all-targets -- -D warnings

      - name: cargo clippy (no_std)
        if: github.event_name != 'pull_request'
        run: cargo hack clippy ${{ env.RUST_NO_STD_PKGS }} --locked --optional-deps --each-feature --ignore-unknown-features --features libm,u8_pipeline,f32_pipeline --exclude-features ${{ env.FEATURES_DEPENDING_ON_STD }} --target x86_64-unknown-none -- -D warnings

      - name: cargo clippy
        if: github.event_name != 'pull_request'
        run: cargo hack clippy --workspace --exclude vello_bench --locked --optional-deps --each-feature --ignore-unknown-features --features std,u8_pipeline,f32_pipeline -- -D warnings

      - name: cargo clippy (vello_cpu - u8 pipeline)
        if: github.event_name != 'pull_request'
        run: cargo clippy -p vello_cpu --locked --no-default-features --features std,text,png,u8_pipeline

      - name: cargo clippy (vello_cpu - f32 pipeline)
        if: github.event_name != 'pull_request'
        run: cargo clippy -p vello_cpu --locked --no-default-features --features std,text,png,f32_pipeline

      - name: cargo clippy (auxiliary)
        if: github.event_name != 'pull_request'
        run: cargo hack clippy --workspace --exclude vello_bench --locked --optional-deps --each-feature --ignore-unknown-features --features std,u8_pipeline,f32_pipeline --tests --benches --examples -- -D warnings

      - name: cargo clippy (benchmarks)
        if: github.event_name != 'pull_request'
        run: cargo clippy -p vello_bench --locked --all-targets -- -D warnings

      - name: cargo clippy (wasm32 pull request)
        if: github.event_name == 'pull_request'
        run: cargo clippy --workspace ${{ env.NO_WASM_PKGS }} --exclude vello_bench --locked --target wasm32-unknown-unknown --all-features --all-targets -- -D warnings

      - name: cargo clippy (wasm32 no_std)
        if: github.event_name != 'pull_request'
        run: cargo hack clippy ${{ env.RUST_NO_STD_PKGS }} --locked --target wasm32-unknown-unknown --optional-deps --each-feature --ignore-unknown-features --features libm,u8_pipeline,f32_pipeline --exclude-features ${{ env.FEATURES_DEPENDING_ON_STD }} -- -D warnings

      - name: cargo clippy (wasm32)
        if: github.event_name != 'pull_request'
        run: cargo hack clippy --workspace ${{ env.NO_WASM_PKGS }} --exclude vello_bench --locked --target wasm32-unknown-unknown --optional-deps --each-feature --ignore-unknown-features --features std,u8_pipeline,f32_pipeline -- -D warnings

      - name: cargo clippy (wasm32 auxiliary)
        if: github.event_name != 'pull_request'
        run: cargo hack clippy --workspace ${{ env.NO_WASM_PKGS }} --exclude vello_bench --locked --target wasm32-unknown-unknown --optional-deps --each-feature --ignore-unknown-features --features std,u8_pipeline,f32_pipeline --tests --benches --examples -- -D warnings

  wasm-size:
    name: Vello renderer wasm size
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: wasm32-unknown-unknown

      - name: install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.114

      - name: check Vello renderer wasm sizes
        run: ./vello_tests/web/check_wasm_sizes.sh

  prime-lfs-cache:
    name: Prime LFS Cache
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      lfs-hash: ${{ steps.calc-hash.outputs.result }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - id: calc-hash
      name: Calculate LFS hash
      # GitHub's expression context doesn't support either a literal newline or an escaped newline. We have to use the JSON parser to get a newline character.
      run: echo "result=${{ hashFiles(join(fromJson(env.LFS_FILES), fromJson('"\n"'))) }}" | tee -a "$GITHUB_OUTPUT"
      
    - name: Cache git lfs
      id: lfs-cache
      uses: actions/cache@v4
      with:
        path: .git/lfs
        # The files targeted with git lfs
        key: vello-lfs-${{ steps.calc-hash.outputs.result }}
        restore-keys: vello-lfs-
        enableCrossOsArchive: true

    - name: Fetch lfs data
      if: ${{ steps.lfs-cache.outputs.cache-hit != 'true' }}
      run: git lfs fetch --include '${{ join(fromJson(env.LFS_FILES), ',') }}'
  
  test-stable:
    name: cargo test
    needs: prime-lfs-cache
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      VELLO_CI_GPU_SUPPORT: ${{ matrix.gpu }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: ubuntu-latest
            gpu: 'yes'
          - os: macos-latest
            gpu: 'yes'
          - os: windows-latest
            # TODO: The windows runners theoretically have CPU fallback for GPUs, but
            # this failed in initial testing
            gpu: 'no'
    steps:
      - uses: actions/checkout@v6
        # We intentionally do not use lfs: true here, instead using the caching method to save LFS bandwidth.

      - name: Restore lfs cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          # The files targeted with git lfs
          key: vello-lfs-${{ needs.prime-lfs-cache.outputs.lfs-hash }}
          enableCrossOsArchive: true
  
      - name: Checkout LFS files
        # `git lfs checkout` requires that each individual glob is a separate command line argument.
        # The string `''' '''` is how you write `' '` in GitHub's expression context (i.e. two quotes separated by a space)
        # The quotes are to avoid the shell from evaluating the globs itself.
        run: git lfs checkout '${{ join(fromJson(env.LFS_FILES), ''' ''') }}'
        continue-on-error: true

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}

      - name: install native dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libfontconfig-dev

      # Adapted from https://github.com/bevyengine/bevy/blob/b446374392adc70aceb92621b080d1a6cf7a7392/.github/workflows/validation-jobs.yml#L74-L79
      - name: install xvfb, llvmpipe and lavapipe
        if: matrix.os == 'ubuntu-latest'
        # https://launchpad.net/~kisak/+archive/ubuntu/turtle
        run: |
          sudo apt-get update -y -qq
          sudo add-apt-repository ppa:kisak/turtle -y
          sudo apt-get update
          sudo apt install -y xvfb libegl-mesa0 libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers
      
      - name: install cargo-nextest
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-bin: ${{ matrix.os != 'macos-latest' }} # works around https://github.com/Swatinem/rust-cache/issues/341

      - name: build workspace tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --exclude vello_bench --exclude vello_tests --exclude vello_research_tests --locked --all-features --release --no-run

      - name: build vello_tests
        run: cargo test -p vello_tests --locked --all-features --release --test tests --no-run

      - name: build research renderer tests
        if: matrix.os != 'windows-latest'
        run: cargo test -p vello_research_tests --locked --all-features --release --no-run

      - name: run workspace tests with nextest
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --workspace --exclude vello_bench --exclude vello_tests --exclude vello_research_tests --locked --all-features --no-fail-fast --release

      # vello_tests is one large generated binary. Libtest keeps it in one process, allowing the
      # GPU device and renderer pools to be reused and avoiding thousands of process launches.
      - name: run vello_tests with libtest
        run: cargo test -p vello_tests --locked --all-features --release --test tests --no-fail-fast

      - name: run research renderer tests with libtest
        if: matrix.os != 'windows-latest'
        run: cargo test -p vello_research_tests --locked --all-features --release --no-fail-fast
      
      - name: Upload test results due to failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vello-snapshot-tests-${{ matrix.os }}
          path: |
            research/vello_research_tests/comparisons
            research/vello_research_tests/current
            vello_tests/diffs

      - name: cargo test --doc
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --workspace --exclude vello_bench --locked --all-features --release --no-fail-fast

      - name: check CPU allocation regressions
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        run: cargo bench -p vello_bench --locked --bench allocations

  test-avx512:
    # Since GitHub runners don't support AVX-512, we need to run the tests with Intel SDE. This
    # setup mirrors https://github.com/linebender/fearless_simd/blob/30c7f38cd545b20ec98624bbf62d1357cd8814e3/.github/workflows/ci.yml#L222
    name: vello_tests (AVX-512)
    if: github.event_name != 'pull_request'
    needs: prime-lfs-cache
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_TEST_ARGS: -p vello_tests --locked --release --test tests
      SDE_PKG: sde-external-10.8.0-2026-03-15
      SDE_SHA256: 50b320cd226acef7a491f5b321fc1be3c3c7984f9e27a456e64894b5b0979dd3
      VELLO_TEST_AVX512: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Restore lfs cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: vello-lfs-${{ needs.prime-lfs-cache.outputs.lfs-hash }}

      - name: Checkout LFS files
        run: git lfs checkout '${{ join(fromJson(env.LFS_FILES), ''' ''') }}'

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}

      - name: install Intel Software Development Emulator
        run: |
          curl -fsSL -o "${SDE_PKG}-lin.tar.xz" "https://github.com/Shnatsel/intel-sde-mirror/releases/download/sde-${SDE_PKG#sde-external-}/${SDE_PKG}-lin.tar.xz"
          if ! echo "${SDE_SHA256}  ${SDE_PKG}-lin.tar.xz" | sha256sum -c -; then
            echo "SDE archive checksum verification failed" >&2
            exit 1
          fi
          tar -Jxf "${SDE_PKG}-lin.tar.xz"

      # Building under SDE would be very slow.
      - name: build tests
        run: cargo test --no-run $CARGO_TEST_ARGS

      - name: run vello_tests with AVX-512
        run: ${SDE_PKG}-lin/sde64 -icl -- cargo test $CARGO_TEST_ARGS avx512

  test-stable-wasm:
    name: cargo test (wasm32, default)
    needs: prime-lfs-cache
    # We use MacOS because for some reason the Ubuntu-based runners
    # have trouble handling things like `requestAnimationFrame` or
    # `setTimeout` in our testing code.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        # We intentionally do not use lfs: true here, instead using the caching method to save LFS bandwidth.

      - name: Restore lfs cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          # The files targeted with git lfs
          key: vello-lfs-${{ needs.prime-lfs-cache.outputs.lfs-hash }}
          enableCrossOsArchive: true
  
      - name: Checkout LFS files
        # `git lfs checkout` requires that each individual glob is a separate command line argument.
        # The string `''' '''` is how you write `' '` in GitHub's expression context (i.e. two quotes separated by a space)
        # The quotes are to avoid the shell from evaluating the globs itself.
        run: git lfs checkout '${{ join(fromJson(env.LFS_FILES), ''' ''') }}'
        continue-on-error: true

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: wasm32-unknown-unknown

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Run vello_tests on Chrome
        # We need to run in release mode, because otherwise wasm_parser can't read the
        # blob, see <https://github.com/linebender/vello/pull/1078#issuecomment-3029336905>
        run: wasm-pack test --headless --chrome --features webgl --release
        working-directory: vello_tests

      - name: check vello_gpu is wgpu webgl compatible
        if: github.event_name != 'pull_request'
        run: wasm-pack test --headless --chrome --release
        working-directory: vello_gpu/examples/wgpu_webgl

      - name: check vello_gpu is native webgl compatible
        if: github.event_name != 'pull_request'
        run: wasm-pack test --headless --chrome --release
        working-directory: vello_gpu/examples/native_webgl

  test-stable-wasm-simd:
    name: cargo test (wasm32, simd128)
    if: github.event_name != 'pull_request'
    needs: prime-lfs-cache
    runs-on: macos-latest
    env:
      RUSTFLAGS: -Ctarget-feature=+simd128
    steps:
      - uses: actions/checkout@v6

      - name: Restore lfs cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: vello-lfs-${{ needs.prime-lfs-cache.outputs.lfs-hash }}
          enableCrossOsArchive: true

      - name: Checkout LFS files
        run: git lfs checkout '${{ join(fromJson(env.LFS_FILES), ''' ''') }}'
        continue-on-error: true

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: wasm32-unknown-unknown

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: run vello_tests on Chrome with SIMD
        run: wasm-pack test --headless --chrome --features webgl --release
        working-directory: vello_tests


  check-msrv:
    name: portability checks
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-A single-use-lifetimes'
    steps:
      - uses: actions/checkout@v6

      - name: install msrv toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MIN_VER }}
          targets: x86_64-unknown-none,wasm32-unknown-unknown

      - name: install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: install native dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libfontconfig-dev

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: cargo check (no_std pull request)
        if: github.event_name == 'pull_request'
        run: cargo hack check ${{ env.RUST_NO_STD_PKGS }} --locked --no-default-features --ignore-unknown-features --features libm,u8_pipeline,f32_pipeline --target x86_64-unknown-none

      - name: cargo check (pull request)
        if: github.event_name == 'pull_request'
        run: cargo hack check ${{ env.RUST_MIN_VER_PKGS }} --locked --ignore-unknown-features --features std,u8_pipeline,f32_pipeline

      - name: cargo check (wasm32 pull request)
        if: github.event_name == 'pull_request'
        run: cargo hack check ${{ env.RUST_MIN_VER_PKGS }} ${{ env.NO_WASM_PKGS }} --locked --target wasm32-unknown-unknown --ignore-unknown-features --features std,u8_pipeline,f32_pipeline

      - name: cargo check (no_std feature powerset)
        if: github.event_name != 'pull_request'
        run: cargo hack check ${{ env.RUST_NO_STD_PKGS }} --locked --optional-deps --each-feature --ignore-unknown-features --features libm,u8_pipeline,f32_pipeline --exclude-features ${{ env.FEATURES_DEPENDING_ON_STD }} --target x86_64-unknown-none

      - name: cargo check (feature powerset)
        if: github.event_name != 'pull_request'
        run: cargo hack check ${{ env.RUST_MIN_VER_PKGS }} --locked --optional-deps --each-feature --ignore-unknown-features --features std,u8_pipeline,f32_pipeline

      - name: cargo check (wasm32 feature powerset)
        if: github.event_name != 'pull_request'
        run: cargo hack check ${{ env.RUST_MIN_VER_PKGS }} ${{ env.NO_WASM_PKGS }} --locked --target wasm32-unknown-unknown --optional-deps --each-feature --ignore-unknown-features --features std,u8_pipeline,f32_pipeline

      - name: install stable Android toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: aarch64-linux-android

      - name: install cargo apk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk

      - name: cargo apk check (android)
        run: cargo apk check -p with_winit --lib
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vello-android-target
          # This is a bit of a hack, but cargo apk doesn't seem to allow customising this.
          RUSTFLAGS: '-D warnings'

  check-msrv-platforms:
    name: cargo check (msrv, ${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: '-A single-use-lifetimes'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: install msrv toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MIN_VER }}
          targets: x86_64-unknown-none

      - name: install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: cargo check (no_std)
        run: cargo hack check ${{ env.RUST_NO_STD_PKGS }} --locked --optional-deps --each-feature --ignore-unknown-features --features libm,u8_pipeline,f32_pipeline --exclude-features ${{ env.FEATURES_DEPENDING_ON_STD }} --target x86_64-unknown-none

      - name: cargo check
        run: cargo hack check ${{ env.RUST_MIN_VER_PKGS }} --locked --optional-deps --each-feature --ignore-unknown-features --features std,u8_pipeline,f32_pipeline

  doc:
    name: cargo doc
    if: github.event_name != 'pull_request'
    # NOTE: We don't have any platform specific docs in this workspace, so we only run on Ubuntu.
    #       If we get per-platform docs (win/macos/linux/wasm32/..) then doc jobs should match that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: install native dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libfontconfig-dev

      # We test documentation using nightly to match docs.rs.
      - name: cargo doc
        run: cargo doc --workspace --locked --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: '--cfg docsrs -D warnings'
